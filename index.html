<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hopenity Audio & Video Stock</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #fff; padding: 20px; }
        header { text-align: center; padding: 40px 0; background: linear-gradient(45deg, #ff416c, #ff4b2b); border-radius: 10px; margin-bottom: 30px; }
        header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .section-title { margin: 20px 0; font-size: 1.8rem; border-left: 5px solid #ff4b2b; padding-left: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background-color: #1e1e1e; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.5); padding: 15px; }
        .card h3 { margin-bottom: 10px; font-size: 1.2rem; color: #ff4b2b; }
        video, audio { width: 100%; border-radius: 5px; margin-bottom: 10px; }
        .download-btn { display: inline-block; width: 100%; text-align: center; background-color: #ff4b2b; color: white; padding: 10px; text-decoration: none; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        .download-btn:hover { background-color: #ff416c; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Hopenity Audio & Video Media Library</h1>
        <p>আপনার সব অডিও এবং ভিডিও স্টক ফাইল এক জায়গায়</p>
    </header>

    <!-- ভিডিও সেকশন -->
    <h2 class="section-title">ভিডিও স্টক (Video Stocks)</h2>
    <div class="grid">
        <!-- ভিডিও ১ -->
        <div class="card">
            <h3>Nature Clip 4K</h3>
            <!-- এখানে আপনার ভিডিওর লিংক বসাবেন -->
            <video controls>
                <source src="YOUR_VIDEO_LINK_HERE.mp4" type="video/mp4">
                আপনার ব্রাউজারটি ভিডিও সাপোর্ট করে না।
            </video>
            <a href="YOUR_DOWNLOAD_LINK_HERE" class="download-btn" target="_blank">ডাউনলোড করুন</a>
        </div>
        <!-- আরো ভিডিও যোগ করতে ওপরের কার্ডটি কপি-পেস্ট করুন -->
    </div>

    <!-- অডিও সেকশন -->
    <h2 class="section-title">অডিও স্টক (Audio Stocks)</h2>
    <div class="grid">
        <!-- অডিও ১ -->
        <div class="card">
            <h3>Cinematic Background Music</h3>
            <!-- এখানে আপনার অডিওর লিংক বসাবেন -->
            <audio controls>
                <source src="YOUR_AUDIO_LINK_HERE.mp3" type="audio/mpeg">
                আপনার ব্রাউজারটি অডিও সাপোর্ট করে না।
            </audio>
            <a href="YOUR_DOWNLOAD_LINK_HERE" class="download-btn" target="_blank">ডাউনলোড করুন</a>
        </div>
        <!-- আরো অডিও যোগ করতে ওপরের কার্ডটি কপি-পেস্ট করুন -->
    </div>
</div>

</body>
</html>
