<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hopenity Audio & Video Stock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f2f2f2; color: #111; padding: 20px; }
    header { text-align: center; background: linear-gradient(45deg, #ff416c, #ff4b2b); border-radius: 10px; padding: 20px; color: white; margin-bottom: 30px; }
    header h1 { font-size: 2.2rem; margin-bottom: 10px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .section-title { margin: 30px 0; font-size: 1.6rem; border-left: 5px solid #ff4b2b; padding-left: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .card { background: #ffffff; border-radius: 8px; padding: 15px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); }
    .card h3 { margin-bottom: 10px; color: #ff4b2b; }
    video, audio { width: 100%; border-radius: 5px; margin-bottom: 10px; }
    .download-btn { display: inline-block; width: 100%; padding: 10px; background-color: #ff4b2b; color: white; text-align: center; text-decoration: none; border-radius: 5px; font-weight: bold; }
    .download-btn:hover { background-color: #ff416c; }
  </style>
</head>
<body>

<header>
  <h1>Hopenity Audio & Video Media Library</h1>
  <p>ফ্রি স্টক ফুটেজ, মিউজিক আর সাউন্ড ইফেক্ট ডাউনলোড করুন</p>
</header>

<div class="container">

  <!-- ভিডিও সেকশন -->
  <h2 class="section-title">ভিডিও ক্লিপ (Video Stocks)</h2>
  <div class="grid">
    
    <div class="card">
      <h3>Nature Clip 4K/HD</h3>
      <video controls>
        <source src="YOUR_VIDEO_LINK_HERE.mp4" type="video/mp4">
        আপনার ব্রাউজার ভিডিও সাপোর্ট করে না।
      </video>
      <a href="YOUR_DOWNLOAD_LINK_HERE" class="download-btn" target="_blank">ডাউনলোড করুন</a>
    </div>

  </div>

  <!-- অডিও সেকশন -->
  <h2 class="section-title">মিউজিক ক্লিপ (Audio Stocks)</h2>
  <div class="grid">
    
    <div class="card">
      <h3>Sura</h3>
      <audio controls>
        <source src="https://docs.google.com/uc?export=download&id=1zHgxgHIDSoTRXl3oQD1lTELgZAvm-Z9F" type="audio/mpeg">
        আপনার ব্রাউজার অডিও সাপোর্ট করে।
      </audio>
      <a href="https://drive.google.com/file/d/1zHgxgHIDSoTRXl3oQD1lTELgZAvm-Z9F/view" class="download-btn" target="_blank">ডাউনলোড করুন</a>
    </div>

  </div>

</div>

</body>
</html>
