<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hopenity Audio & Video Stock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #f2f2f2; color: #111; padding: 20px; }
    header { text-align: center; background: linear-gradient(45deg, #ff416c, #ff4b2b); border-radius: 12px; padding: 25px; color: white; margin-bottom: 35px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    header h1 { font-size: 2.2rem; margin-bottom: 8px; }
    .container { max-width: 1100px; margin: 0 auto; }
    .section-title { margin: 35px 0 20px 0; font-size: 1.7rem; border-left: 6px solid #ff4b2b; padding-left: 12px; color: #333; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
    .card { background: #ffffff; border-radius: 12px; padding: 18px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); transition: 0.3s; }
    .card:hover { transform: translateY(-6px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
    .card h3 { margin-bottom: 12px; color: #ff4b2b; font-size: 1.2rem; }
    video, audio { width: 100%; border-radius: 8px; margin-bottom: 12px; background: #000; }
    .download-btn { display: block; width: 100%; padding: 12px; background: linear-gradient(45deg, #ff4b2b, #ff416c); color: white; text-align: center; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 1rem; transition: 0.2s; }
    .download-btn:hover { opacity: 0.9; transform: scale(1.02); }
  </style>
</head>
<body>

<header>
  <h1>Hopenity Audio & Video Library</h1>
  <p>ফ্রি স্টক ফুটেজ, মিউজিক আর সাউন্ড ইফেক্ট ডাউনলোড করুন</p>
</header>

<div class="container">

  <!-- ভিডিও সেকশন -->
  <h2 class="section-title">ভিডিও ক্লিপ (Video Stocks)</h2>
  <div class="grid">
    
    <div class="card">
      <h3>Nature Clip 4K/HD</h3>
      <video controls>
        <source src="YOUR_VIDEO.mp4" type="video/mp4">
        আপনার ব্রাউজার ভিডিও সাপোর্ট করে না।
      </video>
      <a href="YOUR_VIDEO_DOWNLOAD_LINK" class="download-btn" target="_blank">ডাউনলোড করুন</a>
    </div>

  </div>

  <!-- অডিও সেকশন -->
  <h2 class="section-title">মিউজিক ক্লিপ (Audio Stocks)</h2>
  <div class="grid">
    
    <div class="card">
      <h3>Sura</h3>
      <audio controls preload="metadata">
        <source src="sura.mp3" type="audio/mpeg">
        আপনার ব্রাউজার অডিও সাপোর্ট করে না।
      </audio>
      <a href="https://drive.google.com/file/d/1zHgxgHIDSoTRXl3oQD1lTELgZAvm-Z9F/view" class="download-btn" target="_blank">ডাউনলোড করুন</a>
    </div>

  </div>

</div>

</body>
          </html>
